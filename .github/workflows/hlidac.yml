name: Hlidac slev
on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'watchlist.txt'
      - 'hlidac.py'
      - '.github/workflows/hlidac.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: hlidac
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests beautifulsoup4
      - run: python hlidac.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Ulozit vysledky
        run: |
          git config user.name "hlidac-slev"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aktualizace dat [skip ci]"
          git push
